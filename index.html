<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Sinh Nhật!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #feb47b, #ff7e5f);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            animation: bounce 2s infinite ease-in-out;
        }

        h1 {
            color: #ff4757;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        p {
            color: #2f3542;
            font-size: 1.2em;
            line-height: 1.6;
        }

        .cake {
            font-size: 4em;
            margin: 20px 0;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="cake">🎂✨</div>
        <h1>Happy Birthday!</h1>
        <p>Chúc bạn tuổi mới luôn tràn ngập niềm vui, hạnh phúc, gặt hái được nhiều thành công và luôn nở nụ cười trên môi nhé! 🎉🎁</p>
    </div>

</body>
</html>
